<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Calculate · Scientific</title>
<meta name="description" content="A beautiful scientific calculator." />
<meta name="theme-color" content="#F1EBDF" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --paper:    #F1EBDF;
    --paper-2:  #FAF6EC;
    --ink:      #1B1714;
    --ink-2:    #4B4239;
    --muted:    #8C8170;
    --rule:     #D9CFBE;
    --rule-2:   #E7DFCE;
    --accent:   #B65A33;
    --accent-2: #9A4825;
    --key-bg:   #FCF9F1;
    --key-bg-h: #F6F0E1;
    --key-bg-a: #ECE3D0;
    --shadow-card:
       0 1px 0 rgba(255,255,255,.7) inset,
       0 -1px 0 rgba(0,0,0,.04) inset,
       0 30px 60px -30px rgba(50, 35, 20, .25),
       0 8px 18px -10px rgba(50, 35, 20, .18);
    --shadow-key:
       0 1px 0 rgba(255,255,255,.9) inset,
       0 -1px 0 rgba(0,0,0,.05) inset,
       0 1px 1.5px rgba(50, 35, 20, .10),
       0 4px 8px -4px rgba(50, 35, 20, .12);
    --shadow-key-active:
       0 1px 0 rgba(0,0,0,.05) inset,
       0 -1px 0 rgba(255,255,255,.5) inset,
       0 0 0 rgba(0,0,0,0);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: 'Geist', system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background: var(--paper);
    background-image:
      radial-gradient(ellipse 70% 60% at 50% 30%, #F7F1E4 0%, var(--paper) 55%, #E9E0CC 100%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.10  0 0 0 0 0.09  0 0 0 0 0.07  0 0 0 0.05 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    background-blend-mode: multiply;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: clamp(16px, 4vw, 40px);
  }

  .stage {
    width: min(560px, 100%);
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  header.brand {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 0 6px;
  }
  .wordmark {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 30px;
    line-height: 1;
    letter-spacing: .005em;
    color: var(--ink);
  }
  .wordmark .dot { color: var(--accent); font-style: normal; margin-left: 2px; }
  .wordmark .sub {
    font-family: 'Geist', sans-serif;
    font-style: normal;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: .12em;
    text-transform: uppercase;
    margin-left: 10px;
    vertical-align: middle;
  }
  .meta {
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
  }

  .card {
    background: linear-gradient(180deg, var(--paper-2) 0%, #F4EEDD 100%);
    border: 1px solid var(--rule-2);
    border-radius: 22px;
    padding: 22px;
    box-shadow: var(--shadow-card);
    position: relative;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 10px 14px auto 14px;
    height: 1px;
    background: repeating-linear-gradient(90deg, transparent 0 5px, var(--rule) 5px 8px);
    opacity: .55;
  }

  .display {
    padding: 10px 8px 18px;
    margin-bottom: 14px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
    min-height: 100px;
    justify-content: flex-end;
    text-align: right;
    overflow: hidden;
    position: relative;
  }
  .mode-badge {
    position: absolute;
    top: 2px;
    left: 0;
    font-family: 'Geist', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--accent);
    cursor: pointer;
    padding: 2px 7px;
    background: rgba(182, 90, 51, .08);
    border-radius: 6px;
    border: 1px solid rgba(182, 90, 51, .2);
    user-select: none;
    transition: background .12s;
    line-height: 1.6;
  }
  .mode-badge:hover { background: rgba(182, 90, 51, .16); }

  .expr {
    font-family: 'Geist', sans-serif;
    font-feature-settings: "tnum" 1;
    font-size: 13px;
    color: var(--muted);
    height: 18px;
    letter-spacing: .02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
    min-height: 18px;
  }
  .value {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-feature-settings: "tnum" 1, "lnum" 1;
    color: var(--ink);
    line-height: 1;
    font-size: clamp(44px, 10vw, 60px);
    letter-spacing: -.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
    transition: font-size .12s ease;
  }
  .value.shrink-1 { font-size: clamp(36px, 8vw, 48px); }
  .value.shrink-2 { font-size: clamp(28px, 6vw, 38px); }
  .value.shrink-3 { font-size: clamp(20px, 5vw, 28px); }

  .keys {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }

  button.key {
    appearance: none;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
    font-family: 'Geist', sans-serif;
    font-weight: 500;
    font-size: 14px;
    color: var(--ink);
    background: var(--key-bg);
    border: 1px solid var(--rule-2);
    border-radius: 12px;
    padding: 0;
    height: 52px;
    display: grid;
    place-items: center;
    box-shadow: var(--shadow-key);
    transition:
      transform .08s ease,
      background-color .14s ease,
      box-shadow .14s ease,
      color .14s ease,
      border-color .14s ease;
    user-select: none;
    line-height: 1.2;
  }
  button.key:hover { background: var(--key-bg-h); }
  button.key:active,
  button.key.is-pressed {
    background: var(--key-bg-a);
    box-shadow: var(--shadow-key-active);
    transform: translateY(1px);
  }
  button.key:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  button.key sup {
    font-size: 0.6em;
    vertical-align: super;
    line-height: 0;
  }

  /* scientific function keys — warm tint to distinguish from digit/util */
  button.key.sci {
    background: #F6F0E4;
    color: var(--ink-2);
    border-color: var(--rule-2);
    font-size: 13px;
  }
  button.key.sci:hover { background: #EEE5D4; }
  button.key.sci:active,
  button.key.sci.is-pressed {
    background: #E5D9C4;
    box-shadow: var(--shadow-key-active);
    transform: translateY(1px);
  }

  button.key.digit,
  button.key.dot {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 24px;
    font-weight: 400;
    color: var(--ink);
  }

  button.key.util {
    background: transparent;
    color: var(--ink-2);
    font-size: 14px;
    box-shadow: none;
    border-color: var(--rule);
  }
  button.key.util:hover { background: rgba(0,0,0,.025); }
  button.key.util:active,
  button.key.util.is-pressed {
    background: rgba(0,0,0,.05);
    box-shadow: none;
  }

  button.key.op {
    color: var(--accent);
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 26px;
    font-weight: 400;
    border-color: #E8D6C4;
    background: #FBF3E8;
  }
  button.key.op:hover { background: #F6E8D5; }
  button.key.op.is-selected {
    background: var(--accent);
    color: #FBF3E8;
    border-color: var(--accent-2);
  }
  button.key.op.is-selected:hover { background: var(--accent-2); }
  /* xʸ uses Geist since it has superscript markup */
  button.key.op[data-op="pow"] {
    font-family: 'Geist', sans-serif;
    font-style: normal;
    font-size: 14px;
    font-weight: 500;
  }

  button.key.eq {
    background: var(--ink);
    color: var(--paper-2);
    border-color: #000;
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 26px;
    font-weight: 400;
  }
  button.key.eq:hover { background: #2A231D; }
  button.key.eq:active,
  button.key.eq.is-pressed { background: #0E0B09; }

  button.key.zero { grid-column: span 2; }

  footer.foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 8px;
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  footer.foot a {
    color: var(--muted);
    text-decoration: none;
    transition: color .12s;
  }
  footer.foot a:hover { color: var(--ink-2); }

  @media (prefers-reduced-motion: reduce) {
    button.key { transition: none; }
  }

  @media (max-width: 420px) {
    .card { padding: 14px; border-radius: 18px; }
    button.key { height: 46px; font-size: 12px; }
    button.key.digit, button.key.dot { font-size: 20px; }
    button.key.sci { font-size: 11px; }
    .keys { gap: 6px; }
  }
</style>
</head>
<body>

<main class="stage">

  <header class="brand">
    <div class="wordmark">Calculate<span class="dot">.</span><span class="sub">Sci</span></div>
    <div class="meta">No. 002</div>
  </header>

  <section class="card" aria-label="Scientific Calculator">
    <div class="display" aria-live="polite">
      <button class="mode-badge" id="modeBadge" title="Click to toggle DEG / RAD">DEG</button>
      <div class="expr" id="expr">&nbsp;</div>
      <div class="value" id="value">0</div>
    </div>

    <div class="keys" role="group" aria-label="Keypad">

      <!-- Row 1: trig -->
      <button class="key sci" data-fn="sin"      aria-label="Sine">sin</button>
      <button class="key sci" data-fn="cos"      aria-label="Cosine">cos</button>
      <button class="key sci" data-fn="tan"      aria-label="Tangent">tan</button>
      <button class="key sci" data-fn="log"      aria-label="Log base 10">log</button>
      <button class="key sci" data-fn="ln"       aria-label="Natural log">ln</button>

      <!-- Row 2: inverse trig + roots -->
      <button class="key sci" data-fn="asin"     aria-label="Inverse sine">sin<sup>−1</sup></button>
      <button class="key sci" data-fn="acos"     aria-label="Inverse cosine">cos<sup>−1</sup></button>
      <button class="key sci" data-fn="atan"     aria-label="Inverse tangent">tan<sup>−1</sup></button>
      <button class="key sci" data-fn="sqrt"     aria-label="Square root">√x</button>
      <button class="key sci" data-fn="sq"       aria-label="Square">x<sup>2</sup></button>

      <!-- Row 3: constants + more functions -->
      <button class="key sci" data-constant="pi" aria-label="Pi">π</button>
      <button class="key sci" data-constant="e"  aria-label="Euler's number">e</button>
      <button class="key sci" data-fn="tenx"     aria-label="10 to the x">10<sup>x</sup></button>
      <button class="key sci" data-fn="ex"       aria-label="e to the x">e<sup>x</sup></button>
      <button class="key sci" data-fn="recip"    aria-label="Reciprocal">1/x</button>

      <!-- Row 4: utility -->
      <button class="key util" data-action="clear"     aria-label="All clear">AC</button>
      <button class="key util" data-action="sign"      aria-label="Toggle sign">±</button>
      <button class="key util" data-action="percent"   aria-label="Percent">%</button>
      <button class="key sci"  data-fn="fact"          aria-label="Factorial">n!</button>
      <button class="key op"   data-op="divide"        aria-label="Divide">÷</button>

      <!-- Row 5 -->
      <button class="key digit" data-digit="7">7</button>
      <button class="key digit" data-digit="8">8</button>
      <button class="key digit" data-digit="9">9</button>
      <button class="key util"  data-action="backspace" aria-label="Backspace">⌫</button>
      <button class="key op"    data-op="multiply"     aria-label="Multiply">×</button>

      <!-- Row 6 -->
      <button class="key digit" data-digit="4">4</button>
      <button class="key digit" data-digit="5">5</button>
      <button class="key digit" data-digit="6">6</button>
      <button class="key op"    data-op="pow"          aria-label="x to the power y">x<sup>y</sup></button>
      <button class="key op"    data-op="subtract"     aria-label="Subtract">−</button>

      <!-- Row 7 -->
      <button class="key digit" data-digit="1">1</button>
      <button class="key digit" data-digit="2">2</button>
      <button class="key digit" data-digit="3">3</button>
      <button class="key sci"   data-fn="cbrt"         aria-label="Cube root">∛x</button>
      <button class="key op"    data-op="add"          aria-label="Add">+</button>

      <!-- Row 8 -->
      <button class="key digit zero" data-digit="0">0</button>
      <button class="key dot"        data-action="dot"    aria-label="Decimal point">.</button>
      <button class="key sci"        data-fn="abs"        aria-label="Absolute value">|x|</button>
      <button class="key eq"         data-action="equals" aria-label="Equals">=</button>

    </div>
  </section>

  <footer class="foot">
    <a href="index.html">← Basic</a>
    <span>MMXXVI</span>
  </footer>

</main>

<script>
(() => {
  'use strict';

  const valueEl   = document.getElementById('value');
  const exprEl    = document.getElementById('expr');
  const modeBadge = document.getElementById('modeBadge');

  let current           = '0';
  let stored            = null;
  let op                = null;
  let justEvaluated     = false;
  let pendingNewOperand = false;
  let angleDeg          = true;

  const OP_GLYPH = { add: '+', subtract: '−', multiply: '×', divide: '÷', pow: '^' };

  modeBadge.addEventListener('click', () => {
    angleDeg = !angleDeg;
    modeBadge.textContent = angleDeg ? 'DEG' : 'RAD';
  });

  function toRad(x)   { return angleDeg ? x * Math.PI / 180 : x; }
  function fromRad(x) { return angleDeg ? x * 180 / Math.PI : x; }

  function formatNumber(n) {
    if (n === null || n === undefined || n === '') return '0';
    if (typeof n === 'string') {
      if (n === '-') return '-';
      const neg = n.startsWith('-');
      const raw = neg ? n.slice(1) : n;
      const [intPart, decPart] = raw.split('.');
      const grouped = Number(intPart || '0').toLocaleString('en-US');
      let out = grouped;
      if (n.includes('.')) out += '.' + (decPart ?? '');
      return (neg ? '-' : '') + out;
    }
    if (!isFinite(n)) return n === Infinity ? '∞' : 'Error';
    const abs = Math.abs(n);
    if (abs !== 0 && (abs < 1e-9 || abs >= 1e12)) {
      return n.toExponential(6).replace('+', '');
    }
    const rounded = Math.round(n * 1e10) / 1e10;
    const [intPart, decPart] = String(rounded).split('.');
    const sign   = intPart.startsWith('-') ? '-' : '';
    const intAbs = sign ? intPart.slice(1) : intPart;
    const grouped = Number(intAbs).toLocaleString('en-US');
    return sign + grouped + (decPart !== undefined ? '.' + decPart : '');
  }

  function fitValue(text) {
    valueEl.classList.remove('shrink-1', 'shrink-2', 'shrink-3');
    const len = text.length;
    if (len > 18)      valueEl.classList.add('shrink-3');
    else if (len > 14) valueEl.classList.add('shrink-2');
    else if (len > 10) valueEl.classList.add('shrink-1');
  }

  function render() {
    const display = formatNumber(current);
    valueEl.textContent = display;
    fitValue(display);
    if (op !== null && stored !== null) {
      exprEl.textContent = `${formatNumber(stored)} ${OP_GLYPH[op]}`;
    } else {
      exprEl.innerHTML = '&nbsp;';
    }
  }

  function resetIfNeeded() {
    if (justEvaluated) {
      current = '0'; stored = null; op = null; justEvaluated = false;
    }
    if (pendingNewOperand) {
      current = '0'; pendingNewOperand = false;
    }
  }

  function inputDigit(d) {
    resetIfNeeded();
    if (current === '0' || current === '-0') {
      current = (current.startsWith('-') ? '-' : '') + d;
    } else if (current === 'Error') {
      current = d;
    } else {
      if (current.replace('-', '').replace('.', '').length >= 15) return;
      current += d;
    }
    render();
  }

  function inputDot() {
    resetIfNeeded();
    if (current === 'Error') current = '0';
    if (!current.includes('.')) {
      current = (current === '' || current === '-') ? current + '0.' : current + '.';
      render();
    }
  }

  function toggleSign() {
    if (current === 'Error' || current === '0') return;
    current = current.startsWith('-') ? current.slice(1) : '-' + current;
    render();
  }

  function percent() {
    const n = parseFloat(current);
    if (!isFinite(n)) return;
    const result = (op !== null && stored !== null) ? (stored * n) / 100 : n / 100;
    current = String(Math.round(result * 1e10) / 1e10);
    justEvaluated = false;
    render();
  }

  function clearAll() {
    current = '0'; stored = null; op = null; justEvaluated = false; pendingNewOperand = false;
    render();
  }

  function backspace() {
    if (justEvaluated) { clearAll(); return; }
    if (current === 'Error') { current = '0'; render(); return; }
    if (current.length <= 1 || (current.length === 2 && current.startsWith('-'))) {
      current = '0';
    } else {
      current = current.slice(0, -1);
      if (current === '-') current = '0';
    }
    render();
  }

  function factorial(n) {
    if (n < 0 || !Number.isInteger(n) || n > 170) return NaN;
    let r = 1;
    for (let i = 2; i <= n; i++) r *= i;
    return r;
  }

  function applyFn(name) {
    const n = parseFloat(current);
    if (isNaN(n)) { error(); return; }
    let result;
    switch (name) {
      case 'sin':   result = Math.sin(toRad(n)); break;
      case 'cos':   result = Math.cos(toRad(n)); break;
      case 'tan':   result = Math.tan(toRad(n)); break;
      case 'asin':  result = fromRad(Math.asin(n)); break;
      case 'acos':  result = fromRad(Math.acos(n)); break;
      case 'atan':  result = fromRad(Math.atan(n)); break;
      case 'log':   result = Math.log10(n); break;
      case 'ln':    result = Math.log(n); break;
      case 'sqrt':  result = Math.sqrt(n); break;
      case 'cbrt':  result = Math.cbrt(n); break;
      case 'sq':    result = n * n; break;
      case 'tenx':  result = Math.pow(10, n); break;
      case 'ex':    result = Math.exp(n); break;
      case 'recip': result = 1 / n; break;
      case 'abs':   result = Math.abs(n); break;
      case 'fact':  result = factorial(n); break;
      default: return;
    }
    if (!isFinite(result) || isNaN(result)) { error(); return; }
    result = Math.round(result * 1e12) / 1e12;
    const label = { sin:'sin', cos:'cos', tan:'tan', asin:'sin⁻¹', acos:'cos⁻¹', atan:'tan⁻¹',
                    log:'log', ln:'ln', sqrt:'√', cbrt:'∛', sq:'sqr', tenx:'10^',
                    ex:'e^', recip:'1/', abs:'|', fact:'fact' }[name] || name;
    exprEl.textContent = `${label}(${formatNumber(n)}) =`;
    current = String(result);
    justEvaluated = true;
    pendingNewOperand = false;
    const display = formatNumber(current);
    valueEl.textContent = display;
    fitValue(display);
  }

  function inputConst(name) {
    if (justEvaluated) { stored = null; op = null; justEvaluated = false; }
    pendingNewOperand = false;
    current = name === 'pi' ? String(Math.PI) : String(Math.E);
    render();
  }

  function setOp(next) {
    if (current === 'Error') return;
    const n = parseFloat(current);
    if (stored === null) {
      stored = n;
    } else if (!justEvaluated && op) {
      const raw = compute(stored, n, op);
      if (raw === null || !isFinite(raw) || isNaN(raw)) { error(); return; }
      stored = Math.round(raw * 1e10) / 1e10;
      current = String(stored);
    }
    op = next;
    justEvaluated = false;
    pendingNewOperand = true;
    render();
    flashOp(next);
  }

  function equals() {
    if (op === null || stored === null) return;
    const n = parseFloat(current);
    const raw = compute(stored, n, op);
    if (raw === null || !isFinite(raw) || isNaN(raw)) { error(); return; }
    const result = Math.round(raw * 1e10) / 1e10;
    exprEl.textContent = `${formatNumber(stored)} ${OP_GLYPH[op]} ${formatNumber(n)} =`;
    current = String(result);
    stored = null; op = null; justEvaluated = true; pendingNewOperand = false;
    const display = formatNumber(current);
    valueEl.textContent = display;
    fitValue(display);
  }

  function compute(a, b, operator) {
    switch (operator) {
      case 'add':      return a + b;
      case 'subtract': return a - b;
      case 'multiply': return a * b;
      case 'divide':   return b === 0 ? null : a / b;
      case 'pow':      return Math.pow(a, b);
    }
    return null;
  }

  function error() {
    current = 'Error'; stored = null; op = null; justEvaluated = true; pendingNewOperand = false;
    valueEl.textContent = 'Error';
    fitValue('Error');
    exprEl.innerHTML = '&nbsp;';
    clearOpFlash();
  }

  function flashOp(next) {
    document.querySelectorAll('button.key.op').forEach(b => {
      b.classList.toggle('is-selected', b.dataset.op === next);
    });
  }
  function clearOpFlash() {
    document.querySelectorAll('button.key.op').forEach(b => b.classList.remove('is-selected'));
  }

  document.querySelectorAll('button.key').forEach(btn => {
    btn.addEventListener('click', () => {
      const { digit, op: o, action, fn, constant } = btn.dataset;
      if (digit !== undefined)      { inputDigit(digit); clearOpFlash(); return; }
      if (o)                        { setOp(o); return; }
      if (fn)                       { applyFn(fn); clearOpFlash(); return; }
      if (constant)                 { inputConst(constant); clearOpFlash(); return; }
      if (action === 'dot')         { inputDot(); clearOpFlash(); return; }
      if (action === 'clear')       { clearAll(); clearOpFlash(); return; }
      if (action === 'sign')        { toggleSign(); return; }
      if (action === 'percent')     { percent(); clearOpFlash(); return; }
      if (action === 'equals')      { equals(); clearOpFlash(); return; }
      if (action === 'backspace')   { backspace(); return; }
    });
  });

  window.addEventListener('keydown', (e) => {
    const k = e.key;
    if (/^[0-9]$/.test(k))                      { inputDigit(k); clearOpFlash(); }
    else if (k === '.')                          { inputDot(); clearOpFlash(); }
    else if (k === '+')                          { setOp('add'); }
    else if (k === '-')                          { setOp('subtract'); }
    else if (k === '*')                          { setOp('multiply'); }
    else if (k === '/')                          { e.preventDefault(); setOp('divide'); }
    else if (k === '^')                          { setOp('pow'); }
    else if (k === 'Enter' || k === '=')         { e.preventDefault(); equals(); clearOpFlash(); }
    else if (k === 'Backspace')                  { backspace(); }
    else if (k === 'Escape' || k === 'Delete')   { clearAll(); clearOpFlash(); }
    else if (k === '%')                          { percent(); clearOpFlash(); }
  });

  render();
})();
</script>

</body>
</html>
