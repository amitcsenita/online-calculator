<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Calculate</title>
<meta name="description" content="A small, beautiful four-function calculator." />
<meta name="theme-color" content="#F1EBDF" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<style>
  :root {
    --paper:    #F1EBDF;
    --paper-2:  #FAF6EC;
    --ink:      #1B1714;
    --ink-2:    #4B4239;
    --muted:    #8C8170;
    --rule:     #D9CFBE;
    --rule-2:   #E7DFCE;
    --accent:   #B65A33;
    --accent-2: #9A4825;
    --key-bg:   #FCF9F1;
    --key-bg-h: #F6F0E1;
    --key-bg-a: #ECE3D0;
    --shadow-card:
       0 1px 0 rgba(255,255,255,.7) inset,
       0 -1px 0 rgba(0,0,0,.04) inset,
       0 30px 60px -30px rgba(50, 35, 20, .25),
       0 8px 18px -10px rgba(50, 35, 20, .18);
    --shadow-key:
       0 1px 0 rgba(255,255,255,.9) inset,
       0 -1px 0 rgba(0,0,0,.05) inset,
       0 1px 1.5px rgba(50, 35, 20, .10),
       0 4px 8px -4px rgba(50, 35, 20, .12);
    --shadow-key-active:
       0 1px 0 rgba(0,0,0,.05) inset,
       0 -1px 0 rgba(255,255,255,.5) inset,
       0 0 0 rgba(0,0,0,0);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: 'Geist', system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background: var(--paper);
    /* Warm paper backdrop with a soft vignette + subtle grain */
    background-image:
      radial-gradient(ellipse 70% 60% at 50% 30%, #F7F1E4 0%, var(--paper) 55%, #E9E0CC 100%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.10  0 0 0 0 0.09  0 0 0 0 0.07  0 0 0 0.05 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    background-blend-mode: multiply;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: clamp(16px, 4vw, 40px);
  }

  /* ——————————— Layout ——————————— */

  .stage {
    width: min(420px, 100%);
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  header.brand {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 0 6px;
  }
  .wordmark {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 30px;
    line-height: 1;
    letter-spacing: .005em;
    color: var(--ink);
  }
  .wordmark .dot {
    color: var(--accent);
    font-style: normal;
    margin-left: 2px;
  }
  .meta {
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
  }

  /* ——————————— Card ——————————— */

  .card {
    background: linear-gradient(180deg, var(--paper-2) 0%, #F4EEDD 100%);
    border: 1px solid var(--rule-2);
    border-radius: 22px;
    padding: 22px;
    box-shadow: var(--shadow-card);
    position: relative;
  }
  /* Top sewn-paper rule */
  .card::before {
    content: "";
    position: absolute;
    inset: 10px 14px auto 14px;
    height: 1px;
    background: repeating-linear-gradient(
      90deg,
      transparent 0 5px,
      var(--rule) 5px 8px
    );
    opacity: .55;
  }

  /* ——————————— Display ——————————— */

  .display {
    padding: 10px 8px 18px;
    margin-bottom: 14px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
    min-height: 120px;
    justify-content: flex-end;
    text-align: right;
    overflow: hidden;
  }
  .expr {
    font-family: 'Geist', sans-serif;
    font-feature-settings: "tnum" 1;
    font-size: 13px;
    color: var(--muted);
    height: 18px;
    letter-spacing: .02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
    min-height: 18px;
  }
  .value {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-feature-settings: "tnum" 1, "lnum" 1;
    color: var(--ink);
    line-height: 1;
    font-size: clamp(54px, 14vw, 72px);
    letter-spacing: -.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
    transition: font-size .12s ease;
  }
  .value.shrink-1 { font-size: clamp(44px, 11vw, 58px); }
  .value.shrink-2 { font-size: clamp(34px, 9vw,  46px); }
  .value.shrink-3 { font-size: clamp(26px, 7vw,  36px); }

  /* ——————————— Keypad ——————————— */

  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  button.key {
    appearance: none;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
    font-family: 'Geist', sans-serif;
    font-weight: 500;
    font-size: 22px;
    color: var(--ink);
    background: var(--key-bg);
    border: 1px solid var(--rule-2);
    border-radius: 14px;
    padding: 0;
    height: 60px;
    display: grid;
    place-items: center;
    box-shadow: var(--shadow-key);
    transition:
      transform .08s ease,
      background-color .14s ease,
      box-shadow .14s ease,
      color .14s ease,
      border-color .14s ease;
    user-select: none;
    position: relative;
  }
  button.key:hover { background: var(--key-bg-h); }
  button.key:active,
  button.key.is-pressed {
    background: var(--key-bg-a);
    box-shadow: var(--shadow-key-active);
    transform: translateY(1px);
  }
  button.key:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* digit keys use the elegant serif italic */
  button.key.digit,
  button.key.dot {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 28px;
    font-weight: 400;
    color: var(--ink);
  }

  /* utility row */
  button.key.util {
    background: transparent;
    color: var(--ink-2);
    font-size: 18px;
    box-shadow: none;
    border-color: var(--rule);
  }
  button.key.util:hover { background: rgba(0,0,0,.025); }
  button.key.util:active,
  button.key.util.is-pressed {
    background: rgba(0,0,0,.05);
    box-shadow: none;
  }

  /* operator keys: terracotta accent */
  button.key.op {
    color: var(--accent);
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 30px;
    font-weight: 400;
    border-color: #E8D6C4;
    background: #FBF3E8;
  }
  button.key.op:hover { background: #F6E8D5; }
  button.key.op.is-selected {
    background: var(--accent);
    color: #FBF3E8;
    border-color: var(--accent-2);
  }
  button.key.op.is-selected:hover { background: var(--accent-2); }

  /* equals */
  button.key.eq {
    background: var(--ink);
    color: var(--paper-2);
    border-color: #000;
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 30px;
    font-weight: 400;
  }
  button.key.eq:hover { background: #2A231D; }
  button.key.eq:active,
  button.key.eq.is-pressed { background: #0E0B09; }

  /* span-2 for zero */
  button.key.zero { grid-column: span 2; justify-items: start; }

  /* ——————————— Footer ——————————— */

  footer.foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 8px;
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  footer.foot kbd {
    font-family: 'Geist', sans-serif;
    font-size: 10px;
    background: rgba(0,0,0,.04);
    border: 1px solid var(--rule);
    border-bottom-width: 1.5px;
    padding: 2px 5px;
    border-radius: 4px;
    color: var(--ink-2);
    letter-spacing: 0;
    text-transform: none;
    font-weight: 500;
  }

  /* Reduce-motion respect */
  @media (prefers-reduced-motion: reduce) {
    button.key { transition: none; }
  }

  /* ——————————— History ——————————— */

  .history-card { padding: 16px 22px; }
  .history-card::before { display: none; }
  .h-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--rule);
  }
  .h-title {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 18px;
    color: var(--ink);
  }
  .h-clear {
    appearance: none;
    background: none;
    border: none;
    cursor: pointer;
    font-family: 'Geist', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 2px 6px;
    border-radius: 4px;
    transition: color .12s, background .12s;
  }
  .h-clear:hover { color: var(--accent); background: rgba(182,90,51,.06); }
  .h-list {
    list-style: none;
    margin: 0; padding: 0;
    display: flex;
    flex-direction: column;
    max-height: 200px;
    overflow-y: auto;
  }
  .h-item {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 7px 2px;
    border-bottom: 1px solid var(--rule-2);
    gap: 12px;
  }
  .h-item:last-child { border-bottom: none; }
  .h-expr {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }
  .h-result {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 20px;
    color: var(--ink);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .h-empty {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    padding: 14px 0;
  }

  /* Compact phones */
  @media (max-width: 360px) {
    .card { padding: 16px; border-radius: 18px; }
    button.key { height: 54px; font-size: 20px; }
    button.key.digit, button.key.dot { font-size: 25px; }
    .keys { gap: 8px; }
  }
</style>
</head>
<body>

<main class="stage">

  <header class="brand">
    <div class="wordmark">Calculate<span class="dot">.</span></div>
    <div class="meta">No. 001</div>
  </header>

  <section class="card" aria-label="Calculator">
    <div class="display" aria-live="polite">
      <div class="expr" id="expr">&nbsp;</div>
      <div class="value" id="value">0</div>
    </div>

    <div class="keys" role="group" aria-label="Keypad">
      <button class="key util" data-action="clear"     aria-label="All clear">AC</button>
      <button class="key util" data-action="sign"      aria-label="Toggle sign">±</button>
      <button class="key util" data-action="percent"   aria-label="Percent">%</button>
      <button class="key op"   data-op="divide"        aria-label="Divide">÷</button>

      <button class="key digit" data-digit="7">7</button>
      <button class="key digit" data-digit="8">8</button>
      <button class="key digit" data-digit="9">9</button>
      <button class="key op"   data-op="multiply"      aria-label="Multiply">×</button>

      <button class="key digit" data-digit="4">4</button>
      <button class="key digit" data-digit="5">5</button>
      <button class="key digit" data-digit="6">6</button>
      <button class="key op"   data-op="subtract"      aria-label="Subtract">−</button>

      <button class="key digit" data-digit="1">1</button>
      <button class="key digit" data-digit="2">2</button>
      <button class="key digit" data-digit="3">3</button>
      <button class="key op"   data-op="add"           aria-label="Add">+</button>

      <button class="key digit zero" data-digit="0">0</button>
      <button class="key dot"        data-action="dot" aria-label="Decimal point">.</button>
      <button class="key eq"         data-action="equals" aria-label="Equals">=</button>
    </div>
  </section>

  <section class="card history-card" aria-label="Calculation history">
    <div class="h-head">
      <span class="h-title">History</span>
      <button class="h-clear" onclick="clearHistory()">Clear</button>
    </div>
    <ul class="h-list" id="historyList">
      <li class="h-empty">No calculations yet</li>
    </ul>
  </section>

  <footer class="foot">
    <span>Press <kbd>⌫</kbd> to undo · <kbd>Esc</kbd> clears</span>
    <a href="scientific-calculator.html" style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-decoration:none;">Sci →</a>
  </footer>

</main>

<script>
(() => {
  'use strict';

  const valueEl = document.getElementById('value');
  const exprEl  = document.getElementById('expr');

  // State
  let current = '0';     // string the user is typing
  let stored  = null;    // previous number (Number) waiting for an op
  let op      = null;    // pending operator: 'add' | 'subtract' | 'multiply' | 'divide'
  let justEvaluated = false; // last action was '=' — typing a digit should reset

  const OP_GLYPH = { add: '+', subtract: '−', multiply: '×', divide: '÷' };

  // ——— Formatting ———

  function formatNumber(numLike) {
    if (numLike === null || numLike === undefined || numLike === '') return '0';
    if (typeof numLike === 'string') {
      // If user is mid-typing, keep their string (preserves trailing ".", "-0.", etc.)
      // but group the integer portion with commas for readability.
      if (numLike === '-' ) return '-';
      const neg = numLike.startsWith('-');
      const raw = neg ? numLike.slice(1) : numLike;
      const [intPart, decPart] = raw.split('.');
      const grouped = Number(intPart || '0').toLocaleString('en-US');
      let out = grouped;
      if (numLike.includes('.')) out += '.' + (decPart ?? '');
      return (neg ? '-' : '') + out;
    }
    // Numeric
    if (!isFinite(numLike)) return 'Error';
    // Avoid losing precision; cap at ~12 significant digits.
    const abs = Math.abs(numLike);
    if (abs !== 0 && (abs < 1e-6 || abs >= 1e12)) {
      return numLike.toExponential(6).replace('+', '');
    }
    // Round to mitigate float dust (0.1 + 0.2 = 0.3, etc.)
    const rounded = Math.round(numLike * 1e10) / 1e10;
    const [intPart, decPart] = String(rounded).split('.');
    const sign = intPart.startsWith('-') ? '-' : '';
    const intAbs = sign ? intPart.slice(1) : intPart;
    const grouped = Number(intAbs).toLocaleString('en-US');
    return sign + grouped + (decPart !== undefined ? '.' + decPart : '');
  }

  function fitValue(text) {
    valueEl.classList.remove('shrink-1', 'shrink-2', 'shrink-3');
    const len = text.length;
    if (len > 18)      valueEl.classList.add('shrink-3');
    else if (len > 14) valueEl.classList.add('shrink-2');
    else if (len > 10) valueEl.classList.add('shrink-1');
  }

  function render() {
    const display = formatNumber(current);
    valueEl.textContent = display;
    fitValue(display);

    if (op !== null && stored !== null) {
      exprEl.textContent = `${formatNumber(stored)} ${OP_GLYPH[op]}`;
    } else {
      exprEl.innerHTML = '&nbsp;';
    }
  }

  // ——— Logic ———

  function inputDigit(d) {
    if (justEvaluated) {
      current = '0';
      stored = null;
      op = null;
      justEvaluated = false;
    }
    if (current === '0' || current === '-0') {
      current = (current.startsWith('-') ? '-' : '') + d;
    } else if (current === 'Error') {
      current = d;
    } else {
      if (current.replace('-', '').replace('.', '').length >= 14) return;
      current += d;
    }
    render();
  }

  function inputDot() {
    if (justEvaluated) {
      current = '0';
      stored = null;
      op = null;
      justEvaluated = false;
    }
    if (current === 'Error') current = '0';
    if (!current.includes('.')) {
      current = (current === '' || current === '-') ? (current + '0.') : current + '.';
      render();
    }
  }

  function toggleSign() {
    if (current === 'Error') return;
    if (current === '0') return;
    current = current.startsWith('-') ? current.slice(1) : '-' + current;
    render();
  }

  function percent() {
    const n = parseFloat(current);
    if (!isFinite(n)) return;
    // If we have a pending op + stored, percent = stored * n / 100 (typical calculator behaviour).
    let result;
    if (op !== null && stored !== null) {
      result = (stored * n) / 100;
    } else {
      result = n / 100;
    }
    current = String(Math.round(result * 1e10) / 1e10);
    justEvaluated = false;
    render();
  }

  function clearAll() {
    current = '0';
    stored = null;
    op = null;
    justEvaluated = false;
    render();
  }

  function backspace() {
    if (justEvaluated) { clearAll(); return; }
    if (current === 'Error') { current = '0'; render(); return; }
    if (current.length <= 1 || (current.length === 2 && current.startsWith('-'))) {
      current = '0';
    } else {
      current = current.slice(0, -1);
      if (current === '-') current = '0';
    }
    render();
  }

  function setOp(next) {
    if (current === 'Error') return;
    const n = parseFloat(current);

    if (stored === null) {
      stored = n;
    } else if (!justEvaluated && op) {
      // Chain: compute pending op first
      const raw = compute(stored, n, op);
      if (raw === null) { error(); return; }
      const result = Math.round(raw * 1e10) / 1e10;
      stored = result;
      current = String(result);
    }
    op = next;
    justEvaluated = false;
    // Mark that next digit should start a new operand
    pendingNewOperand = true;
    render();
    flashOp(next);
  }

  function equals() {
    if (op === null || stored === null) return;
    const n = parseFloat(current);
    const raw = compute(stored, n, op);
    if (raw === null) { error(); return; }
    const result = Math.round(raw * 1e10) / 1e10;
    // Update the expression line briefly to show the full computation
    exprEl.textContent = `${formatNumber(stored)} ${OP_GLYPH[op]} ${formatNumber(n)} =`;
    saveCalc(exprEl.textContent, formatNumber(result));
    current = String(result);
    stored = null;
    op = null;
    justEvaluated = true;
    const display = formatNumber(current);
    valueEl.textContent = display;
    fitValue(display);
  }

  function compute(a, b, operator) {
    switch (operator) {
      case 'add':      return a + b;
      case 'subtract': return a - b;
      case 'multiply': return a * b;
      case 'divide':   return b === 0 ? null : a / b;
    }
    return null;
  }

  function error() {
    current = 'Error';
    stored = null;
    op = null;
    justEvaluated = true;
    valueEl.textContent = 'Error';
    fitValue('Error');
    exprEl.innerHTML = '&nbsp;';
  }

  // When user picks an op, the next digit press should start a fresh operand.
  let pendingNewOperand = false;
  const _inputDigit = inputDigit;
  inputDigit = function(d) {
    if (pendingNewOperand) {
      current = '0';
      pendingNewOperand = false;
    }
    _inputDigit(d);
  };
  const _inputDot = inputDot;
  inputDot = function() {
    if (pendingNewOperand) {
      current = '0';
      pendingNewOperand = false;
    }
    _inputDot();
  };

  // ——— UI wiring ———

  function flashOp(next) {
    document.querySelectorAll('button.key.op').forEach(b => {
      b.classList.toggle('is-selected', b.dataset.op === next);
    });
  }
  function clearOpFlash() {
    document.querySelectorAll('button.key.op').forEach(b => b.classList.remove('is-selected'));
  }

  document.querySelectorAll('button.key').forEach(btn => {
    btn.addEventListener('click', () => {
      const { digit, op: o, action } = btn.dataset;
      if (digit !== undefined) { inputDigit(digit); clearOpFlash(); return; }
      if (o)                    { setOp(o); return; }
      if (action === 'dot')     { inputDot(); clearOpFlash(); return; }
      if (action === 'clear')   { clearAll(); clearOpFlash(); return; }
      if (action === 'sign')    { toggleSign(); return; }
      if (action === 'percent') { percent(); clearOpFlash(); return; }
      if (action === 'equals')  { equals(); clearOpFlash(); return; }
    });
  });

  // ——— Keyboard ———

  function findKey(selector) { return document.querySelector(selector); }
  function pressVisual(el) {
    if (!el) return;
    el.classList.add('is-pressed');
    setTimeout(() => el.classList.remove('is-pressed'), 90);
  }

  window.addEventListener('keydown', (e) => {
    const k = e.key;
    let target = null;

    if (/^[0-9]$/.test(k))        { inputDigit(k); clearOpFlash(); target = findKey(`button[data-digit="${k}"]`); }
    else if (k === '.')           { inputDot(); clearOpFlash(); target = findKey('button[data-action="dot"]'); }
    else if (k === '+')           { setOp('add'); target = findKey('button[data-op="add"]'); }
    else if (k === '-')           { setOp('subtract'); target = findKey('button[data-op="subtract"]'); }
    else if (k === '*' || k === 'x' || k === 'X') { setOp('multiply'); target = findKey('button[data-op="multiply"]'); }
    else if (k === '/')           { e.preventDefault(); setOp('divide'); target = findKey('button[data-op="divide"]'); }
    else if (k === 'Enter' || k === '=') { e.preventDefault(); equals(); clearOpFlash(); target = findKey('button[data-action="equals"]'); }
    else if (k === 'Backspace')   { backspace(); target = null; }
    else if (k === 'Escape' || k === 'Delete' || (k === 'c' || k === 'C')) { clearAll(); clearOpFlash(); target = findKey('button[data-action="clear"]'); }
    else if (k === '%')           { percent(); clearOpFlash(); target = findKey('button[data-action="percent"]'); }
    else return;

    pressVisual(target);
  });

  // First paint
  render();
})();

const _sb = window.supabase.createClient(
  'https://wmvcfrfgkvifkvpngvoq.supabase.co',
  'sb_publishable_krGF4GzVpHCtwQzCZPQnGw_lcaxbRGc'
);

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function saveCalc(expr, result) {
  await _sb.from('calculations').insert({ expression: expr, result: String(result) });
  loadHistory();
}

async function loadHistory() {
  const { data } = await _sb
    .from('calculations')
    .select('id, expression, result')
    .order('created_at', { ascending: false })
    .limit(20);
  renderHistory(data || []);
}

async function clearHistory() {
  await _sb.from('calculations').delete().gte('id', 0);
  renderHistory([]);
}

function renderHistory(records) {
  const list = document.getElementById('historyList');
  if (!records.length) {
    list.innerHTML = '<li class="h-empty">No calculations yet</li>';
    return;
  }
  list.innerHTML = records.map(r =>
    `<li class="h-item">
      <span class="h-expr">${escHtml(r.expression)}</span>
      <span class="h-result">${escHtml(r.result)}</span>
    </li>`
  ).join('');
}

loadHistory();
