<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tools · Daily Planner</title>
<meta name="description" content="A 24-hour daily task planner with reflection and analytics." />
<meta name="theme-color" content="#F1EBDF" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<style>
:root {
  --paper:       #F1EBDF;
  --paper-2:     #FAF6EC;
  --ink:         #1B1714;
  --ink-2:       #4B4239;
  --muted:       #8C8170;
  --rule:        #D9CFBE;
  --rule-2:      #E7DFCE;
  --accent:      #B65A33;
  --accent-2:    #9A4825;
  --accent-soft: #FBF3E8;
  --green:       #5A8A5A;
  --green-soft:  #E8EFD9;
  --shadow-card:
     0 1px 0 rgba(255,255,255,.7) inset,
     0 -1px 0 rgba(0,0,0,.04) inset,
     0 28px 56px -28px rgba(50,35,20,.24),
     0 8px 18px -10px rgba(50,35,20,.16);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: 'Geist', system-ui, -apple-system, sans-serif;
  color: var(--ink);
  background: var(--paper);
  background-image:
    radial-gradient(ellipse 70% 60% at 50% 30%, #F7F1E4 0%, var(--paper) 55%, #E9E0CC 100%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.10  0 0 0 0 0.09  0 0 0 0 0.07  0 0 0 0.05 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  background-blend-mode: multiply;
  -webkit-font-smoothing: antialiased;
  min-height: 100dvh;
  display: grid;
  place-items: start center;
  padding: clamp(16px, 4vw, 40px);
}

/* ── Layout ── */
.stage {
  width: min(800px, 100%);
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding-bottom: 48px;
}

/* ── Header ── */
header.brand {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding: 0 6px;
}
a.wordmark {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  font-size: 30px;
  line-height: 1;
  color: var(--ink);
  text-decoration: none;
}
.wordmark .dot  { color: var(--accent); font-style: normal; margin-left: 2px; }
.wordmark .sub  {
  font-family: 'Geist', sans-serif; font-style: normal;
  font-size: 11px; font-weight: 600; color: var(--muted);
  letter-spacing: .12em; text-transform: uppercase;
  margin-left: 10px; vertical-align: middle;
}
.meta-area {
  font-size: 11px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--muted); font-weight: 500;
}

/* ── Card ── */
.card {
  background: linear-gradient(180deg, var(--paper-2) 0%, #F4EEDD 100%);
  border: 1px solid var(--rule-2);
  border-radius: 22px;
  padding: 22px;
  box-shadow: var(--shadow-card);
  position: relative;
}
.card::before {
  content: "";
  position: absolute;
  inset: 10px 14px auto 14px;
  height: 1px;
  background: repeating-linear-gradient(90deg, transparent 0 5px, var(--rule) 5px 8px);
  opacity: .55;
}

/* Card-section labels (like from the mock) */
.section-label {
  font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase;
  color: var(--muted); font-weight: 600;
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 14px;
}
.section-label::after { content: ''; flex: 1; height: 1px; background: var(--rule); }
.reflect-status { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; font-weight: 500; white-space: nowrap; }
.reflect-status.saving { color: var(--muted); }
.reflect-status.saved  { color: var(--green); }
.reflect-status.error  { color: var(--accent); }
.sub-label {
  font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--muted); font-weight: 600; display: block; margin-bottom: 8px;
}

/* ── Date nav ── */
.date-nav {
  display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
}
.nav-btn {
  appearance: none; background: transparent; border: 1px solid var(--rule);
  border-radius: 10px; cursor: pointer; font-size: 16px; color: var(--ink-2);
  width: 34px; height: 34px; display: grid; place-items: center;
  flex-shrink: 0; transition: background .12s;
}
.nav-btn:hover { background: rgba(0,0,0,.03); }
.date-center { flex: 1; display: flex; flex-direction: column; align-items: center; }
.day-name {
  font-family: 'Instrument Serif', serif; font-style: italic;
  font-size: 22px; color: var(--ink); line-height: 1;
}
.date-full { font-size: 12px; color: var(--muted); letter-spacing: .05em; margin-top: 1px; }
.jump-input {
  font-family: 'Geist', sans-serif; font-size: 11px; background: transparent;
  border: 1px solid var(--rule); border-radius: 8px; padding: 5px 8px;
  color: var(--ink-2); outline: none; cursor: pointer; flex-shrink: 0; color-scheme: light;
}
.jump-input:focus { border-color: var(--accent); }

/* ── Filter bar ── */
.filter-bar {
  border-top: 1px solid var(--rule-2);
  border-bottom: 1px solid var(--rule-2);
  padding: 10px 0 12px;
  margin-bottom: 12px;
  display: flex; flex-direction: column; gap: 7px;
}
.filter-row { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 8px; }
.filter-section-lbl {
  font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--muted); font-weight: 600; flex-shrink: 0; min-width: 62px;
}
.filter-pills { display: flex; flex-wrap: wrap; gap: 4px; }

.f-pill {
  appearance: none; background: transparent; border: 1px solid var(--rule);
  border-radius: 999px; padding: 3px 10px;
  font-family: 'Geist', sans-serif; font-size: 11px; font-weight: 500;
  color: var(--ink-2); cursor: pointer; transition: all .12s; white-space: nowrap;
}
.f-pill:hover { border-color: var(--accent); color: var(--accent); }
.f-pill.active { background: var(--ink); border-color: var(--ink); color: var(--paper-2); }
.f-pill.active-soft { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.f-pill .cdot {
  display: inline-block; width: 7px; height: 7px; border-radius: 50%;
  margin-right: 4px; vertical-align: middle; background: var(--c, var(--muted));
}
.f-pill.active-soft .cdot { opacity: .9; }

/* Active filter chips */
.filter-chips-row {
  display: flex; flex-wrap: wrap; align-items: center; gap: 5px;
  padding-top: 7px; border-top: 1px solid var(--rule-2);
}
.filter-chips-row:empty { display: none; }
.fchip {
  display: inline-flex; align-items: center; gap: 4px;
  background: var(--accent-soft); border: 1px solid rgba(182,90,51,.25);
  border-radius: 999px; padding: 2px 7px 2px 9px;
  font-size: 11px; color: var(--accent); font-weight: 500;
}
.fchip button {
  appearance: none; background: none; border: none; cursor: pointer;
  color: var(--accent); font-size: 14px; line-height: 1; padding: 0; opacity: .55;
}
.fchip button:hover { opacity: 1; }
.fclear-all {
  appearance: none; background: none; border: none; cursor: pointer;
  font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase;
  font-weight: 500; padding: 0; transition: color .12s; margin-left: auto;
}
.fclear-all:hover { color: var(--accent); }
.filter-result-count {
  font-size: 11px; color: var(--muted); margin-left: 4px;
}

/* ── Hour grid ── */
.hour-grid {
  max-height: 440px; overflow-y: auto;
  scrollbar-width: thin; scrollbar-color: var(--rule) transparent;
  margin: 0 -4px; padding: 0 4px;
}
.hour-grid-empty {
  display: none; text-align: center; padding: 24px 0;
  font-size: 13px; color: var(--muted);
}
.hour-grid-empty.show { display: block; }

.hour-row {
  display: flex; align-items: center; gap: 10px;
  min-height: 42px; padding: 4px 4px 4px 6px;
  border-bottom: 1px solid var(--rule-2);
  border-left: 3px solid transparent;
  transition: background .10s;
}
.hour-row:last-child { border-bottom: none; }
.hour-row:hover { background: rgba(0,0,0,.015); }
.hour-row.is-now { border-left-color: var(--accent); background: rgba(182,90,51,.03); }
.hour-row.is-now .hour-label { color: var(--accent); font-weight: 600; }
.hour-row.prio-high:not(.is-now) { border-left-color: var(--accent); }
.hour-row.prio-low  { border-left-color: rgba(140,129,112,.3); }
.hour-row.filtered-out { display: none; }

.hour-label {
  font-family: 'Geist', sans-serif; font-size: 11px; color: var(--muted);
  font-weight: 500; letter-spacing: .04em; width: 42px; flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}
.hour-content {
  flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0;
}

/* View mode */
.prio-badge { font-size: 12px; flex-shrink: 0; line-height: 1; }
.prio-badge.high { color: var(--accent); }
.prio-badge.low  { color: var(--muted); opacity: .55; }
.task-text {
  flex: 1; font-size: 14px; color: var(--ink); cursor: pointer;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: color .10s;
}
.task-text:hover { color: var(--accent); }
.task-text.is-done { text-decoration: line-through; color: var(--muted); }
.cat-badge {
  font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  padding: 2px 8px; border-radius: 20px; flex-shrink: 0;
  border: 1px solid currentColor; opacity: .7; white-space: nowrap;
}
.empty-hint {
  font-size: 12px; color: var(--rule); cursor: pointer; flex: 1;
  transition: color .12s; user-select: none;
}
.hour-row:hover .empty-hint { color: var(--muted); }
.btn-check {
  appearance: none; background: none; border: 1.5px solid var(--ink-2);
  border-radius: 50%; width: 28px; height: 28px; display: grid; place-items: center;
  font-size: 13px; color: var(--ink-2); cursor: pointer; flex-shrink: 0;
  transition: all .12s; padding: 0;
}
.btn-check:hover  { border-color: var(--green); color: var(--green); background: rgba(90,138,90,.08); }
.btn-check.is-checked { border-color: var(--green); color: var(--green); background: rgba(90,138,90,.14); }

/* Edit mode */
.task-input {
  flex: 1; min-width: 0; font-family: 'Geist', sans-serif; font-size: 13px;
  background: var(--paper-2); border: 1px solid var(--rule); border-radius: 8px;
  padding: 5px 10px; color: var(--ink); outline: none; transition: border-color .12s;
}
.task-input:focus { border-color: var(--accent); }
.cat-sel {
  font-family: 'Geist', sans-serif; font-size: 12px; background: var(--paper-2);
  border: 1px solid var(--rule); border-radius: 6px; padding: 5px 6px;
  color: var(--ink-2); cursor: pointer; outline: none; flex-shrink: 0;
}
/* Priority segmented control */
.prio-seg {
  display: inline-flex; gap: 1px; flex-shrink: 0;
  border: 1px solid var(--rule); border-radius: 7px;
  padding: 2px; background: var(--paper-2);
}
.prio-seg-btn {
  appearance: none; border: none; background: transparent;
  border-radius: 5px; font-size: 12px; padding: 3px 7px;
  cursor: pointer; color: var(--muted); transition: all .12s;
  font-family: 'Geist', sans-serif; font-weight: 600; line-height: 1.2;
}
.prio-seg-btn:hover { color: var(--ink-2); background: rgba(0,0,0,.04); }
.prio-seg-btn.active { background: var(--ink); color: var(--paper-2); }
.prio-seg-btn[data-p="high"].active { background: var(--accent); }
.prio-seg-btn[data-p="low"].active  { background: var(--muted); }
.btn-save, .btn-del, .btn-cancel {
  appearance: none; border: none; border-radius: 6px; cursor: pointer;
  font-family: 'Geist', sans-serif; font-size: 12px; font-weight: 500;
  padding: 5px 10px; flex-shrink: 0; transition: background .12s; white-space: nowrap;
}
.btn-save { background: var(--ink); color: var(--paper-2); }
.btn-save:hover { background: #2A231D; }
.btn-del  { background: transparent; color: var(--accent); border: 1px solid rgba(182,90,51,.25); }
.btn-del:hover  { background: rgba(182,90,51,.08); }
.btn-cancel     { background: transparent; color: var(--muted); padding: 5px 6px; }
.btn-cancel:hover { background: rgba(0,0,0,.04); }

/* Grid footer */
.grid-footer {
  display: flex; align-items: center; gap: 10px;
  margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--rule-2);
}
.progress-bar-wrap { flex: 1; height: 4px; background: var(--rule-2); border-radius: 2px; overflow: hidden; }
.progress-bar      { height: 100%; background: var(--green); border-radius: 2px; transition: width .3s ease; }
.grid-stat         { font-size: 12px; color: var(--muted); white-space: nowrap; }
.grid-stat strong  { color: var(--ink-2); font-weight: 600; }

/* ── Reflection ── */
.reflect-top {
  display: grid; grid-template-columns: auto 1fr;
  gap: 20px; margin-bottom: 18px; align-items: start;
}

/* Grade */
.grade-pills { display: flex; gap: 5px; flex-wrap: wrap; }
.grade-pill {
  appearance: none; border: 1px solid var(--rule); background: rgba(255,255,255,.45);
  color: var(--ink-2); font-family: 'Instrument Serif', serif; font-style: italic;
  font-size: 17px; padding: 6px 12px; border-radius: 8px; cursor: pointer;
  transition: all .12s; min-width: 42px; text-align: center;
}
.grade-pill:hover   { border-color: var(--accent); color: var(--accent); }
.grade-pill.active  { background: var(--accent); color: var(--paper-2); border-color: var(--accent-2); }

/* Ratings */
.ratings-grid  { display: flex; flex-direction: column; gap: 10px; }
.rating-row    { display: grid; grid-template-columns: 68px 1fr; align-items: center; gap: 12px; }
.rating-label  { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.dots          { display: flex; gap: 5px; }
.dot-btn       { appearance: none; border: 1.5px solid var(--rule); background: rgba(255,255,255,.45); border-radius: 50%; width: 20px; height: 20px; padding: 0; cursor: pointer; transition: all .1s; }
.dot-btn:hover { border-color: var(--ink-2); }
.dot-btn.filled{ background: var(--accent); border-color: var(--accent-2); }

/* Reflect textareas */
.reflect-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
.reflect-cell h4 {
  font-family: 'Instrument Serif', serif; font-style: italic;
  font-weight: 400; font-size: 18px; margin: 0 0 8px; color: var(--ink);
}
.reflect-cell textarea {
  width: 100%; background: rgba(255,255,255,.4); border: 1px solid var(--rule);
  border-radius: 10px; padding: 12px 14px;
  font-family: 'Instrument Serif', serif; font-style: italic;
  font-size: 15px; color: var(--ink); line-height: 1.55; resize: vertical;
  min-height: 96px; outline: none; transition: border-color .15s, background .15s;
}
.reflect-cell textarea::placeholder { color: var(--muted); }
.reflect-cell textarea:focus { border-color: var(--accent); background: rgba(255,255,255,.6); }

/* ── Analytics ── */
.atabs-row {
  display: flex; gap: 2px; margin-bottom: 16px;
  border-bottom: 1px solid var(--rule-2); padding-bottom: 0;
}
.atab {
  appearance: none; background: none; border: none;
  font-family: 'Geist', sans-serif; font-size: 11.5px;
  letter-spacing: .1em; text-transform: uppercase; font-weight: 600;
  color: var(--muted); cursor: pointer; padding: 7px 14px;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  transition: color .12s;
}
.atab:hover { color: var(--ink-2); }
.atab.active { color: var(--accent); border-bottom-color: var(--accent); }
.apane { display: none; }
.apane.active { display: block; }

/* Stat boxes */
.stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; margin-bottom: 16px; }
.stat-box {
  background: rgba(255,255,255,.4); border: 1px solid var(--rule);
  border-radius: 12px; padding: 10px 14px; display: flex; flex-direction: column; gap: 3px;
}
.stat-num {
  font-family: 'Instrument Serif', serif; font-style: italic;
  font-size: 26px; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums;
}
.stat-num.accent { color: var(--accent); }
.stat-num.green  { color: var(--green); }
.stat-lbl { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* Category bars */
.cat-bars { display: flex; flex-direction: column; gap: 7px; }
.cat-bar-row { display: grid; grid-template-columns: 72px 1fr 22px; align-items: center; gap: 8px; }
.cat-bar-lbl { font-size: 11px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat-bar-track { height: 6px; background: var(--rule-2); border-radius: 3px; overflow: hidden; }
.cat-bar-fill  { height: 100%; border-radius: 3px; transition: width .3s ease; }
.cat-bar-cnt   { font-size: 11px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }

/* Priority breakdown */
.prio-breakdown { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.prio-stat {
  background: rgba(255,255,255,.4); border: 1px solid var(--rule);
  border-radius: 10px; padding: 8px 14px; display: flex; align-items: center; gap: 8px;
  font-size: 13px; color: var(--ink-2);
}
.prio-stat .pnum {
  font-family: 'Instrument Serif', serif; font-style: italic;
  font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums;
}

/* Week chart */
.week-cols { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; }
.week-col  { display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: default; }
.week-col.clickable { cursor: pointer; }
.week-count  { font-size: 11px; font-weight: 600; color: var(--ink-2); height: 15px; line-height: 15px; }
.week-bar-wrap  { width: 100%; height: 60px; display: flex; align-items: flex-end; }
.week-bar-stack {
  width: 100%; display: flex; flex-direction: column;
  overflow: hidden; border-radius: 3px 3px 0 0;
}
.week-lbl { font-size: 10px; color: var(--muted); font-weight: 500; letter-spacing: .04em; }
.week-lbl.today  { color: var(--accent); font-weight: 600; }
.week-lbl.active { color: var(--ink); font-weight: 600; }
.chart-legend {
  display: flex; align-items: center; gap: 12px; margin-top: 10px;
  font-size: 11px; color: var(--muted);
}
.legend-dot { display: inline-block; width: 10px; height: 6px; border-radius: 2px; margin-right: 4px; }

/* Month heatmap */
.month-cal { display: flex; flex-direction: column; gap: 3px; margin-top: 4px; }
.month-week-row { display: grid; grid-template-columns: 26px repeat(7,1fr); gap: 3px; }
.month-day-head { font-size: 9.5px; text-align: center; color: var(--muted); letter-spacing: .07em; text-transform: uppercase; font-weight: 600; padding-bottom: 4px; }
.month-cell {
  aspect-ratio: 1; border-radius: 5px; background: var(--rule-2);
  display: grid; place-items: center; font-size: 9.5px; color: var(--muted);
  cursor: default; transition: all .1s; font-variant-numeric: tabular-nums;
}
.month-cell.has { cursor: pointer; }
.month-cell.has:hover { outline: 1.5px solid var(--accent); }
.month-cell.c0 { background: var(--rule-2); }
.month-cell.c1 { background: #D4E8D4; color: var(--ink-2); }
.month-cell.c2 { background: #AECFAE; color: var(--ink-2); }
.month-cell.c3 { background: #82B882; color: var(--ink); }
.month-cell.c4 { background: #5A8A5A; color: var(--paper-2); }
.month-cell.today  { outline: 2px solid var(--accent); outline-offset: 1px; }
.month-cell.active { outline: 2px solid var(--ink); outline-offset: 1px; }
.month-week-lbl { font-size: 9px; color: var(--muted); display: flex; align-items: center; justify-content: flex-end; padding-right: 4px; }
.heatmap-legend { display: flex; align-items: center; gap: 4px; margin-top: 8px; font-size: 11px; color: var(--muted); }
.heatmap-legend .sq { display: inline-block; width: 12px; height: 12px; border-radius: 3px; }

/* ── Footer ── */
footer.foot {
  display: flex; justify-content: space-between; align-items: center;
  padding: 0 8px; font-size: 11px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--muted);
}
footer.foot a { color: var(--muted); text-decoration: none; transition: color .12s; }
footer.foot a:hover { color: var(--ink-2); }

/* ── Responsive ── */
@media (max-width: 640px) {
  .reflect-top  { grid-template-columns: 1fr; }
  .reflect-grid { grid-template-columns: 1fr; }
  .filter-row   { flex-direction: column; align-items: flex-start; gap: 4px; }
}
@media (max-width: 480px) {
  .cat-sel  { display: none; }
  .btn-del  { display: none; }
  .prio-seg { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
}
</style>
</head>
<body>

<main class="stage">

  <header class="brand">
    <a class="wordmark" href="index.html">Tools<span class="dot">.</span><span class="sub">Daily</span></a>
    <div id="authArea" class="meta-area">…</div>
  </header>

  <!-- ── Schedule card ── -->
  <section class="card" aria-label="Daily Planner">

    <!-- Date navigation -->
    <div class="date-nav">
      <button class="nav-btn" id="prevDay" aria-label="Previous day">←</button>
      <div class="date-center">
        <span class="day-name" id="dayName"></span>
        <span class="date-full" id="dateStr"></span>
      </div>
      <button class="nav-btn" id="nextDay" aria-label="Next day">→</button>
      <input type="date" class="jump-input" id="jumpDate" aria-label="Jump to date">
    </div>

    <!-- Filter bar -->
    <div class="filter-bar" id="filterBar">
      <div class="filter-row">
        <span class="filter-section-lbl">Hours</span>
        <div class="filter-pills" id="hrPills">
          <button class="f-pill active" data-hr="all"       data-s="0"  data-e="23">All</button>
          <button class="f-pill"        data-hr="day"       data-s="6"  data-e="22">6–22</button>
          <button class="f-pill"        data-hr="working"   data-s="9"  data-e="18">9–18</button>
          <button class="f-pill"        data-hr="morning"   data-s="6"  data-e="11">Morning</button>
          <button class="f-pill"        data-hr="afternoon" data-s="12" data-e="17">Afternoon</button>
          <button class="f-pill"        data-hr="evening"   data-s="18" data-e="23">Evening</button>
        </div>
      </div>
      <div class="filter-row">
        <span class="filter-section-lbl">Category</span>
        <div class="filter-pills" id="catPills"><!-- filled by JS --></div>
      </div>
      <div class="filter-row">
        <span class="filter-section-lbl">Priority</span>
        <div class="filter-pills" id="prioPills">
          <button class="f-pill" data-pf="high">↑ High</button>
          <button class="f-pill" data-pf="normal">— Normal</button>
          <button class="f-pill" data-pf="low">↓ Low</button>
        </div>
      </div>
      <div class="filter-chips-row" id="filterChips"></div>
    </div>

    <!-- Hour grid -->
    <div class="hour-grid" id="hourGrid" role="list" aria-label="Hour schedule"></div>
    <div class="hour-grid-empty" id="gridEmpty">No tasks match the active filters.</div>

    <!-- Progress footer -->
    <div class="grid-footer">
      <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
      <span class="grid-stat" id="gridStat"><strong>0</strong> / 0 done</span>
    </div>
  </section>

  <!-- ── Reflection card ── -->
  <section class="card" id="reflectionSection" aria-label="Daily reflection">
    <div class="section-label">Reflection <span id="reflectStatus" class="reflect-status"></span></div>

    <div class="reflect-top">
      <!-- Grade -->
      <div>
        <span class="sub-label">How did the day go?</span>
        <div class="grade-pills" id="gradeRow">
          <button class="grade-pill" data-grade="A+">A+</button>
          <button class="grade-pill" data-grade="A">A</button>
          <button class="grade-pill" data-grade="B">B</button>
          <button class="grade-pill" data-grade="C">C</button>
          <button class="grade-pill" data-grade="D">D</button>
          <button class="grade-pill" data-grade="F">F</button>
        </div>
      </div>
      <!-- Self-check ratings -->
      <div>
        <span class="sub-label">Self-check</span>
        <div class="ratings-grid" id="ratingsArea">
          <div class="rating-row" data-key="focus"><span class="rating-label">Focus</span><div class="dots"></div></div>
          <div class="rating-row" data-key="energy"><span class="rating-label">Energy</span><div class="dots"></div></div>
          <div class="rating-row" data-key="mood"><span class="rating-label">Mood</span><div class="dots"></div></div>
        </div>
      </div>
    </div>

    <div class="reflect-grid">
      <div class="reflect-cell">
        <h4>Wins</h4>
        <textarea data-key="wins" placeholder="What went well? Highlights, moments to remember…"></textarea>
      </div>
      <div class="reflect-cell">
        <h4>Could be better</h4>
        <textarea data-key="fix" placeholder="What didn't go to plan? What slowed you down?"></textarea>
      </div>
      <div class="reflect-cell">
        <h4>Lessons &amp; notes</h4>
        <textarea data-key="learn" placeholder="One thing learned, one thing to carry forward…"></textarea>
      </div>
    </div>
  </section>

  <!-- ── Analytics card ── -->
  <section class="card" id="analyticsSection" aria-label="Analytics">
    <div class="section-label">Analytics</div>
    <div class="atabs-row">
      <button class="atab active" data-tab="today">Today</button>
      <button class="atab" data-tab="week">This Week</button>
      <button class="atab" data-tab="month">28 Days</button>
    </div>
    <div class="apane active" id="pane-today"></div>
    <div class="apane" id="pane-week"></div>
    <div class="apane" id="pane-month"></div>
  </section>

  <footer class="foot">
    <a href="index.html">← Home</a>
    <span>MMXXVI</span>
  </footer>

</main>

<script>
(() => {
  'use strict';

  const API         = 'https://calculator-api-beige.vercel.app/api/tasks';
  const REFLECT_API = 'https://calculator-api-beige.vercel.app/api/reflections';
  let saving     = false;
  let currentUid = null;

  const DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const MONTHS = ['January','February','March','April','May','June',
                  'July','August','September','October','November','December'];

  // ── Categories ──────────────────────────────────────────────────────────────
  let CATS = {
    work:     { label: 'Work',     color: '#4A7FA5' },
    personal: { label: 'Personal', color: '#B65A33' },
    health:   { label: 'Health',   color: '#5A8A5A' },
    general:  { label: 'General',  color: '#8C8170' },
  };
  const CUSTOM_COLORS = ['#7A6FA5','#A5836F','#5A8A8A','#8A7A5A','#6F8A7A','#A57A6F','#7A8A5A'];

  // ── State ────────────────────────────────────────────────────────────────────
  const REFLECT_DEF = () => ({ grade: null, focus: 0, energy: 0, mood: 0, wins: '', fix: '', learn: '' });
  const state = {
    date:        '',
    tasks:       {},
    reflection:  REFLECT_DEF(),
    editingHour: null,
    editingCat:  {},
    editingPrio: {},
    heatmap:     {},
    filters: {
      hrPreset: 'all', hrStart: 0, hrEnd: 23,
      cats:  new Set(),
      prios: new Set(),
    },
  };

  // ── Helpers ──────────────────────────────────────────────────────────────────
  function pad(n) { return String(n).padStart(2, '0'); }
  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  }
  function parseLocal(s) {
    const [y,m,d] = s.split('-').map(Number);
    return new Date(y, m-1, d);
  }
  function offset(s, n) {
    const d = parseLocal(s); d.setDate(d.getDate()+n);
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  }
  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function debounce(fn, ms) {
    let t;
    const d = (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
    d.cancel = () => clearTimeout(t);
    return d;
  }

  function setReflectStatus(s, time) {
    const el = document.getElementById('reflectStatus');
    if (!el) return;
    if (s === 'saving') {
      el.textContent = 'saving…'; el.className = 'reflect-status saving';
    } else if (s === 'saved') {
      const t = time || new Date();
      el.textContent = `saved ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
      el.className = 'reflect-status saved';
    } else if (s === 'error') {
      el.textContent = 'save failed'; el.className = 'reflect-status error';
    } else {
      el.textContent = ''; el.className = 'reflect-status';
    }
  }

  // ── Reflection API ────────────────────────────────────────────────────────────
  async function loadReflection(date) {
    state.reflection = REFLECT_DEF();
    setReflectStatus('idle');
    try {
      const headers = await window.authHeaders();
      const res  = await fetch(`${REFLECT_API}?date=${date}`, { headers });
      const data = await res.json();
      if (data) state.reflection = { ...REFLECT_DEF(), ...data };
    } catch {}
    renderReflection();
    renderAnalyticsToday();
  }

  async function saveReflection(fields) {
    setReflectStatus('saving');
    try {
      const headers = await window.authHeaders();
      const res = await fetch(REFLECT_API, {
        method: 'POST', headers,
        body:   JSON.stringify({ date: state.date, ...fields }),
      });
      const data = await res.json();
      if (data) state.reflection = { ...REFLECT_DEF(), ...data };
      setReflectStatus('saved', new Date());
    } catch {
      setReflectStatus('error');
    }
  }

  const saveReflectionDebounced = debounce(saveReflection, 800);

  // ── Header ────────────────────────────────────────────────────────────────────
  function updateHeader() {
    const d    = parseLocal(state.date);
    const tod  = new Date(); tod.setHours(0,0,0,0);
    const diff = Math.round((parseLocal(state.date) - tod) / 86400000);
    let name = DAYS[d.getDay()];
    if (diff === 0) name = 'Today';
    else if (diff === -1) name = 'Yesterday';
    else if (diff === 1)  name = 'Tomorrow';
    document.getElementById('dayName').textContent = name;
    document.getElementById('dateStr').textContent =
      `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
    document.getElementById('jumpDate').value = state.date;
  }

  // ── Filters ───────────────────────────────────────────────────────────────────
  function isVisible(h) {
    if (state.editingHour === h) return true;
    const f = state.filters;
    if (h < f.hrStart || h > f.hrEnd) return false;
    if (f.cats.size > 0 || f.prios.size > 0) {
      const task = state.tasks[h];
      if (!task || !task.task_text) return false;
      if (f.cats.size > 0  && !f.cats.has(task.category || 'general'))  return false;
      if (f.prios.size > 0 && !f.prios.has(task.priority || 'normal')) return false;
    }
    return true;
  }

  function renderFilterBar() {
    const f = state.filters;
    // Hour preset buttons
    document.querySelectorAll('[data-hr]').forEach(b =>
      b.classList.toggle('active', b.dataset.hr === f.hrPreset));
    // Category pills
    const catPills = document.getElementById('catPills');
    catPills.innerHTML = Object.entries(CATS).map(([k,v]) =>
      `<button class="f-pill${f.cats.has(k)?' active-soft':''}" data-cf="${k}">` +
      `<span class="cdot" style="background:${v.color}"></span>${v.label}</button>`
    ).join('');
    catPills.querySelectorAll('[data-cf]').forEach(b => {
      b.addEventListener('click', () => {
        const k = b.dataset.cf;
        if (f.cats.has(k)) f.cats.delete(k); else f.cats.add(k);
        applyFilters();
      });
    });
    // Priority pills
    document.querySelectorAll('[data-pf]').forEach(b =>
      b.classList.toggle('active-soft', f.prios.has(b.dataset.pf)));
    renderFilterChips();
  }

  function renderFilterChips() {
    const f = state.filters;
    const chips = document.getElementById('filterChips');
    const parts = [];
    if (f.hrPreset !== 'all')
      parts.push(`<span class="fchip">Hours&nbsp;${pad(f.hrStart)}–${pad(f.hrEnd)}<button onclick="window._clearHr()">×</button></span>`);
    f.cats.forEach(k => {
      const c = CATS[k];
      if (c) parts.push(`<span class="fchip">${c.label}<button onclick="window._clearCat('${k}')">×</button></span>`);
    });
    f.prios.forEach(p => {
      const lbl = p==='high'?'↑ High' : p==='low'?'↓ Low' : '— Normal';
      parts.push(`<span class="fchip">${lbl}<button onclick="window._clearPrio('${p}')">×</button></span>`);
    });
    if (parts.length > 1)
      parts.push(`<button class="fclear-all" onclick="window._clearAll()">Clear all</button>`);
    chips.innerHTML = parts.join('');
  }

  window._clearHr  = () => { const f=state.filters; f.hrPreset='all'; f.hrStart=0; f.hrEnd=23; applyFilters(); };
  window._clearCat  = k => { state.filters.cats.delete(k);   applyFilters(); };
  window._clearPrio = p => { state.filters.prios.delete(p);  applyFilters(); };
  window._clearAll  = () => {
    const f=state.filters; f.hrPreset='all'; f.hrStart=0; f.hrEnd=23;
    f.cats.clear(); f.prios.clear(); applyFilters();
  };

  function applyFilters() { renderFilterBar(); renderGrid(); }

  // ── Load day ──────────────────────────────────────────────────────────────────
  async function loadDay(date) {
    state.date        = date;
    state.tasks       = {};
    state.editingHour = null;
    updateHeader();
    renderGrid();

    // Load tasks and reflection in parallel
    const [, ] = await Promise.allSettled([
      (async () => {
        const headers = await window.authHeaders();
        const res   = await fetch(`${API}?date=${date}`, { headers });
        const tasks = await res.json();
        if (Array.isArray(tasks)) tasks.forEach(t => { state.tasks[t.hour] = t; });
        renderGrid();
        renderAnalyticsToday();
      })(),
      loadReflection(date),
    ]);
  }

  // ── Content builder ───────────────────────────────────────────────────────────
  function buildContent(h, task, isEditing) {
    if (isEditing) {
      const cat  = state.editingCat[h]  || task?.category  || 'general';
      const prio = state.editingPrio[h] || task?.priority || 'normal';
      return `
        <input class="task-input" id="ti-${h}" type="text"
          value="${escHtml(task?.task_text||'')}"
          placeholder="What's at ${pad(h)}:00?" autocomplete="off">
        <select class="cat-sel" id="cs-${h}" onchange="handleCatChange(${h},this.value)">
          ${Object.entries(CATS).map(([k,v]) =>
            `<option value="${k}"${cat===k?' selected':''}>${v.label}</option>`
          ).join('')}
          <option value="__add__" style="color:var(--accent)">＋ Add label…</option>
        </select>
        <span class="prio-seg" id="ps-${h}">
          <button class="prio-seg-btn${prio==='high'?' active':''}" data-p="high"
            onclick="handlePrioChange(${h},'high')">↑</button>
          <button class="prio-seg-btn${prio==='normal'?' active':''}" data-p="normal"
            onclick="handlePrioChange(${h},'normal')">—</button>
          <button class="prio-seg-btn${prio==='low'?' active':''}" data-p="low"
            onclick="handlePrioChange(${h},'low')">↓</button>
        </span>
        ${task?.task_id ? `<button class="btn-del" onclick="_del(${task.task_id},${h})">Del</button>` : ''}
        <button class="btn-cancel" onclick="_cancel()">×</button>`;
    }
    if (task) {
      const cat  = CATS[task.category] || CATS.general;
      const prio = task.priority || 'normal';
      const prioHtml = prio==='high'
        ? `<span class="prio-badge high" title="High priority">↑</span>`
        : prio==='low'
        ? `<span class="prio-badge low" title="Low priority">↓</span>`
        : '';
      return `
        ${prioHtml}
        <span class="task-text${task.completed?' is-done':''}"
          onclick="_edit(${h})">${escHtml(task.task_text)}</span>
        <span class="cat-badge" style="color:${cat.color}">${cat.label}</span>
        <button class="btn-check${task.completed?' is-checked':''}"
          onclick="_toggle(${task.task_id},${h},${!task.completed})"
          aria-label="${task.completed?'Mark undone':'Mark done'}">✓</button>`;
    }
    return `<span class="empty-hint" onclick="_edit(${h})">+ add task</span>`;
  }

  function renderRow(h) {
    const row = document.querySelector(`.hour-row[data-hour="${h}"]`);
    if (!row) return;
    const isNow     = state.date === todayStr() && new Date().getHours() === h;
    const isEditing = state.editingHour === h;
    const task      = state.tasks[h];
    const prio      = task?.priority || 'normal';
    row.className   = 'hour-row'
      + (isNow ? ' is-now' : '')
      + (task && prio==='high' && !isNow ? ' prio-high' : '')
      + (task && prio==='low'            ? ' prio-low'  : '')
      + (!isVisible(h) ? ' filtered-out' : '');
    row.querySelector('.hour-content').innerHTML = buildContent(h, task, isEditing);
    if (isEditing) wireAutoSave(h);
  }

  function wireAutoSave(h) {
    const input  = document.getElementById(`ti-${h}`);
    const catSel = document.getElementById(`cs-${h}`);
    if (!input) return;
    function onBlur() {
      setTimeout(() => {
        const row     = document.querySelector(`.hour-row[data-hour="${h}"]`);
        const focused = document.activeElement;
        if (row && row.contains(focused)) return;
        if (state.editingHour === h && !saving) window._save(h);
      }, 200);
    }
    input.addEventListener('blur', onBlur);
    if (catSel) catSel.addEventListener('blur', onBlur);
  }

  function renderGrid() {
    const grid    = document.getElementById('hourGrid');
    const nowHour = new Date().getHours();
    const isToday = state.date === todayStr();
    grid.innerHTML = '';
    let total = 0, done = 0, visibleCount = 0;

    for (let h = 0; h < 24; h++) {
      const isNow     = isToday && nowHour === h;
      const isEditing = state.editingHour === h;
      const task      = state.tasks[h];
      const prio      = task?.priority || 'normal';
      const visible   = isVisible(h);
      if (visible) visibleCount++;

      const row = document.createElement('div');
      row.className = 'hour-row'
        + (isNow ? ' is-now' : '')
        + (task && prio==='high' && !isNow ? ' prio-high' : '')
        + (task && prio==='low'            ? ' prio-low'  : '')
        + (!visible ? ' filtered-out' : '');
      row.setAttribute('role', 'listitem');
      row.dataset.hour = h;

      const lbl = document.createElement('span');
      lbl.className   = 'hour-label';
      lbl.textContent = `${pad(h)}:00`;
      row.appendChild(lbl);

      const content = document.createElement('div');
      content.className = 'hour-content';
      content.innerHTML = buildContent(h, task, isEditing);
      if (isEditing) wireAutoSave(h);
      row.appendChild(content);
      grid.appendChild(row);

      if (task && task.task_text) { total++; if (task.completed) done++; }
    }

    // Show "no results" message when filters hide everything
    const emptyEl = document.getElementById('gridEmpty');
    emptyEl.classList.toggle('show', visibleCount === 0);

    if (isToday) {
      requestAnimationFrame(() => {
        grid.querySelector('.is-now:not(.filtered-out)')?.scrollIntoView({ block: 'center' });
      });
    }

    const pct = total > 0 ? Math.round((done/total)*100) : 0;
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('gridStat').innerHTML = `<strong>${done}</strong> / ${total} done`;
  }

  // ── Actions ───────────────────────────────────────────────────────────────────
  window._edit = function(h) {
    const prev = state.editingHour;
    state.editingHour = h;
    state.editingPrio[h] = state.tasks[h]?.priority || 'normal';
    if (prev !== null && prev !== h) renderRow(prev);
    renderRow(h);
    requestAnimationFrame(() => document.getElementById(`ti-${h}`)?.focus());
  };

  window._cancel = function() {
    const h = state.editingHour;
    state.editingHour = null;
    delete state.editingCat[h];
    delete state.editingPrio[h];
    if (h !== null) renderRow(h);
  };

  window._save = async function(h) {
    if (saving) return;
    const input    = document.getElementById(`ti-${h}`);
    const catSel   = document.getElementById(`cs-${h}`);
    const text     = input?.value?.trim();
    const category = state.editingCat[h]
                  || (catSel?.value !== '__add__' ? catSel?.value : null)
                  || state.tasks[h]?.category || 'general';
    const priority = state.editingPrio[h] || 'normal';
    delete state.editingCat[h];
    delete state.editingPrio[h];

    if (!text) { window._cancel(); return; }

    const existing = state.tasks[h];
    saving = true;
    state.editingHour = null;
    state.tasks[h] = { ...(existing||{}), task_text: text, category, priority };
    renderRow(h);

    try {
      const headers = await window.authHeaders();
      if (existing?.task_id) {
        const r = await fetch(`${API}?id=${existing.task_id}`, {
          method: 'PATCH', headers,
          body:   JSON.stringify({ task_text: text, category, priority }),
        });
        state.tasks[h] = await r.json();
      } else {
        const r = await fetch(API, {
          method: 'POST', headers,
          body:   JSON.stringify({ date: state.date, hour: h, task_text: text, category, priority }),
        });
        state.tasks[h] = await r.json();
      }
    } catch {}

    saving = false;
    renderRow(h);
    loadHeatmap();
    renderAnalyticsToday();
  };

  window._del = async function(id, h) {
    saving = true; state.editingHour = null; renderRow(h);
    try {
      const headers = await window.authHeaders();
      await fetch(`${API}?id=${id}`, { method: 'DELETE', headers });
      delete state.tasks[h];
    } catch {}
    saving = false; renderRow(h); loadHeatmap(); renderAnalyticsToday();
  };

  window._toggle = async function(id, h, completed) {
    state.tasks[h] = { ...state.tasks[h], completed };
    renderRow(h);
    try {
      const headers = await window.authHeaders();
      const r = await fetch(`${API}?id=${id}`, {
        method: 'PATCH', headers, body: JSON.stringify({ completed }),
      });
      state.tasks[h] = await r.json();
    } catch {}
    renderRow(h); loadHeatmap(); renderAnalyticsToday();
  };

  // ── Priority and category change handlers ─────────────────────────────────────
  window.handlePrioChange = function(h, prio) {
    state.editingPrio[h] = prio;
    document.querySelectorAll(`#ps-${h} .prio-seg-btn`).forEach(b =>
      b.classList.toggle('active', b.dataset.p === prio));
  };

  window.handleCatChange = function(h, val) {
    if (val === '__add__') _showAddCat(h);
    else state.editingCat[h] = val;
  };

  function _showAddCat(h) {
    const sel = document.getElementById(`cs-${h}`);
    if (!sel) return;
    sel.style.display = 'none';
    const wrap = document.createElement('span');
    wrap.id = `ncw-${h}`;
    wrap.style.cssText = 'display:inline-flex;gap:4px;align-items:center;flex-shrink:0';
    wrap.innerHTML = `
      <input id="nci-${h}" type="text" class="task-input"
        style="width:90px;font-size:12px;padding:4px 8px"
        placeholder="Label…" maxlength="24" autocomplete="off">
      <button class="btn-save" style="padding:4px 8px;font-size:12px"
        onclick="window._confirmCat(${h})">✓</button>
      <button class="btn-cancel" onclick="window._cancelCat(${h})">×</button>`;
    sel.parentNode.insertBefore(wrap, sel.nextSibling);
    const inp = document.getElementById(`nci-${h}`);
    inp?.focus();
    inp?.addEventListener('keydown', e => {
      if (e.key==='Enter')  { e.preventDefault(); e.stopPropagation(); window._confirmCat(h); }
      if (e.key==='Escape') { e.stopPropagation(); window._cancelCat(h); }
    });
  }

  window._confirmCat = function(h) {
    const inp   = document.getElementById(`nci-${h}`);
    const label = inp?.value?.trim();
    if (!label) { window._cancelCat(h); return; }
    const currentText = document.getElementById(`ti-${h}`)?.value ?? '';
    const key   = 'c_' + label.toLowerCase().replace(/[^a-z0-9]/g,'_') + '_' + Date.now();
    const color = CUSTOM_COLORS[Object.keys(CATS).length % CUSTOM_COLORS.length];
    CATS[key]   = { label, color };
    if (currentUid) {
      try {
        const stored = JSON.parse(localStorage.getItem(`custom_cats_${currentUid}`)||'[]');
        stored.push({ key, label, color });
        localStorage.setItem(`custom_cats_${currentUid}`, JSON.stringify(stored));
      } catch {}
    }
    state.editingCat[h] = key;
    renderRow(h);
    requestAnimationFrame(() => {
      const ti = document.getElementById(`ti-${h}`);
      if (ti) { ti.value = currentText; ti.focus(); }
    });
    renderFilterBar(); // new category appears in filter pills
  };

  window._cancelCat = function(h) {
    const wrap = document.getElementById(`ncw-${h}`);
    const sel  = document.getElementById(`cs-${h}`);
    wrap?.remove();
    if (sel) { sel.style.display = ''; sel.value = state.editingCat[h] || state.tasks[h]?.category || 'general'; }
  };

  function loadCustomCats(uid) {
    if (!uid) return;
    try {
      const stored = JSON.parse(localStorage.getItem(`custom_cats_${uid}`)||'[]');
      stored.forEach(({ key, label, color }) => { CATS[key] = { label, color }; });
    } catch {}
  }

  // ── Keyboard ──────────────────────────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (state.editingHour === null) return;
    if (e.key === 'Enter')  { e.preventDefault(); window._save(state.editingHour); }
    if (e.key === 'Escape') window._cancel();
  });

  // ── Filter wiring ─────────────────────────────────────────────────────────────
  document.getElementById('hrPills').addEventListener('click', e => {
    const btn = e.target.closest('[data-hr]');
    if (!btn) return;
    state.filters.hrPreset = btn.dataset.hr;
    state.filters.hrStart  = parseInt(btn.dataset.s);
    state.filters.hrEnd    = parseInt(btn.dataset.e);
    applyFilters();
  });
  document.getElementById('prioPills').addEventListener('click', e => {
    const btn = e.target.closest('[data-pf]');
    if (!btn) return;
    const p = btn.dataset.pf;
    if (state.filters.prios.has(p)) state.filters.prios.delete(p);
    else state.filters.prios.add(p);
    applyFilters();
  });

  // ── Heatmap ───────────────────────────────────────────────────────────────────
  async function loadHeatmap() {
    try {
      const headers = await window.authHeaders();
      const res  = await fetch(`${API}?heatmap=true`, { headers });
      const data = await res.json();
      state.heatmap = data;
      renderAnalyticsWeek();
      renderAnalyticsMonth();
    } catch {}
  }

  // ── Reflection ────────────────────────────────────────────────────────────────
  function renderReflection() {
    const r = state.reflection;
    // Grade
    document.querySelectorAll('.grade-pill').forEach(p =>
      p.classList.toggle('active', p.dataset.grade === r.grade));
    // Dot ratings
    document.querySelectorAll('.rating-row').forEach(row => {
      const key = row.dataset.key, val = r[key] || 0;
      const dots = row.querySelector('.dots');
      dots.innerHTML = '';
      for (let i = 1; i <= 5; i++) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'dot-btn' + (i <= val ? ' filled' : '');
        b.setAttribute('aria-label', `${key} ${i} of 5`);
        const ci = i;
        b.addEventListener('click', () => {
          const newVal = (val === ci) ? ci-1 : ci;
          state.reflection[key] = newVal;
          saveReflection({ [key]: newVal });
          renderReflection(); renderAnalyticsToday();
        });
        dots.appendChild(b);
      }
    });
    // Textareas (only update if not focused to avoid cursor jump)
    document.querySelectorAll('.reflect-cell textarea').forEach(t => {
      if (document.activeElement !== t) t.value = r[t.dataset.key] || '';
    });
  }

  document.getElementById('gradeRow').addEventListener('click', e => {
    const btn = e.target.closest('.grade-pill');
    if (!btn) return;
    const newGrade = state.reflection.grade === btn.dataset.grade ? null : btn.dataset.grade;
    state.reflection.grade = newGrade;
    saveReflection({ grade: newGrade });
    renderReflection(); renderAnalyticsToday();
  });

  document.querySelectorAll('.reflect-cell textarea').forEach(t => {
    t.addEventListener('input', () => {
      state.reflection[t.dataset.key] = t.value;
      setReflectStatus('saving');
      saveReflectionDebounced({ [t.dataset.key]: t.value });
    });
    t.addEventListener('blur', () => {
      saveReflectionDebounced.cancel();
      saveReflection({ [t.dataset.key]: t.value });
    });
  });

  // Flush save when user switches tabs or minimises — prevents data loss on sudden close
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      const active = document.activeElement;
      if (active && active.tagName === 'TEXTAREA' && active.dataset.key) {
        saveReflectionDebounced.cancel();
        saveReflection({ [active.dataset.key]: active.value });
      }
    }
  });

  // ── Analytics: Today ──────────────────────────────────────────────────────────
  function renderAnalyticsToday() {
    const pane = document.getElementById('pane-today');
    let total = 0, done = 0;
    const catCounts = {}, prioCounts = { high: 0, normal: 0, low: 0 };

    for (let h = 0; h < 24; h++) {
      const t = state.tasks[h];
      if (!t || !t.task_text) continue;
      total++;
      if (t.completed) done++;
      catCounts[t.category || 'general'] = (catCounts[t.category || 'general'] || 0) + 1;
      prioCounts[t.priority || 'normal']++;
    }

    const r   = state.reflection;
    const pct = total > 0 ? Math.round((done/total)*100) : 0;

    const maxCat = Math.max(...Object.values(catCounts), 1);
    const catBarsHtml = Object.entries(catCounts)
      .sort(([,a],[,b]) => b-a)
      .map(([k, cnt]) => {
        const c = CATS[k] || CATS.general;
        const w = Math.round((cnt/maxCat)*100);
        return `<div class="cat-bar-row">
          <span class="cat-bar-lbl">${c.label}</span>
          <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${w}%;background:${c.color}"></div></div>
          <span class="cat-bar-cnt">${cnt}</span>
        </div>`;
      }).join('');

    const hasPrio = prioCounts.high + prioCounts.low > 0;

    pane.innerHTML = `
      <div class="stats-row">
        <div class="stat-box"><span class="stat-num${pct===100&&total>0?' green':''}">${done}/${total||0}</span><span class="stat-lbl">Done today</span></div>
        <div class="stat-box"><span class="stat-num${pct>=80?' green':''}">${pct}%</span><span class="stat-lbl">Completion</span></div>
        <div class="stat-box"><span class="stat-num${r.grade?' accent':''}">${r.grade||'—'}</span><span class="stat-lbl">Day grade</span></div>
        <div class="stat-box"><span class="stat-num">${r.focus||'—'}</span><span class="stat-lbl">Focus /5</span></div>
        <div class="stat-box"><span class="stat-num">${r.energy||'—'}</span><span class="stat-lbl">Energy /5</span></div>
        <div class="stat-box"><span class="stat-num">${r.mood||'—'}</span><span class="stat-lbl">Mood /5</span></div>
      </div>
      ${catBarsHtml ? `
        <span class="sub-label" style="margin-top:4px">By category</span>
        <div class="cat-bars" style="margin-bottom:14px">${catBarsHtml}</div>` : ''}
      ${hasPrio ? `
        <span class="sub-label">By priority</span>
        <div class="prio-breakdown">
          ${prioCounts.high   ? `<div class="prio-stat"><span class="pnum" style="color:var(--accent)">${prioCounts.high}</span>↑ High</div>` : ''}
          ${prioCounts.normal ? `<div class="prio-stat"><span class="pnum">${prioCounts.normal}</span>— Normal</div>` : ''}
          ${prioCounts.low    ? `<div class="prio-stat"><span class="pnum" style="color:var(--muted)">${prioCounts.low}</span>↓ Low</div>` : ''}
        </div>` : ''}
      ${!total ? `<p style="margin:0;font-size:13px;color:var(--muted)">No tasks for this day yet.</p>` : ''}
    `;
  }

  // ── Analytics: Week ───────────────────────────────────────────────────────────
  function renderAnalyticsWeek() {
    const pane   = document.getElementById('pane-week');
    const todStr = todayStr();
    const todD   = parseLocal(todStr);
    const data   = state.heatmap;

    // Streak
    let streak = 0;
    const sc = new Date(todD);
    for (let i = 0; i < 28; i++) {
      const ds = `${sc.getFullYear()}-${pad(sc.getMonth()+1)}-${pad(sc.getDate())}`;
      if ((data[ds]?.total || 0) > 0) { streak++; sc.setDate(sc.getDate()-1); } else break;
    }

    // Monday of current week
    const dow = todD.getDay();
    const monday = new Date(todD);
    monday.setDate(todD.getDate() - (dow===0 ? 6 : dow-1));

    const labels = ['M','T','W','T','F','S','S'];
    let wTotal = 0, wDone = 0;
    const weekData = labels.map((lbl, i) => {
      const d = new Date(monday); d.setDate(monday.getDate()+i);
      const ds = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
      const e  = data[ds] || { total:0, done:0, pending:0 };
      wTotal += e.total; wDone += e.done;
      return { lbl, ds, ...e, isFuture: ds>todStr, isToday: ds===todStr, isActive: ds===state.date };
    });

    const maxC  = Math.max(...weekData.map(w=>w.total), 1);
    const BMAX  = 60;
    const bars  = weekData.map(({ lbl, ds, total, done, pending, isFuture, isToday, isActive }) => {
      const barH  = total===0 ? 3 : Math.max(8, Math.round((total/maxC)*BMAX));
      const doneH = total>0  ? Math.max(0, Math.round((done/total)*barH)) : 0;
      const pendH = barH - doneH;
      const op    = isFuture ? '0.35' : '1';
      const barHtml = total===0
        ? `<div style="width:100%;height:3px;background:${isToday?'rgba(182,90,51,.15)':'var(--rule-2)'};border-radius:3px 3px 0 0;opacity:${op}"></div>`
        : `<div class="week-bar-stack" style="height:${barH}px;opacity:${op}">` +
          (pendH>0 ? `<div style="height:${pendH}px;background:#C8B898"></div>` : '') +
          (doneH>0 ? `<div style="height:${doneH}px;background:#6B9E6B"></div>` : '') +
          `</div>`;
      return `<div class="week-col${!isFuture&&total>0?' clickable':''}"
        title="${ds}: ${done} done · ${pending||0} pending"
        ${!isFuture&&total>0 ? `onclick="window._navDate('${ds}')"` : ''}>
        <div class="week-count">${total ? done+'/'+total : ''}</div>
        <div class="week-bar-wrap">${barHtml}</div>
        <div class="week-lbl${isToday?' today':''}${isActive&&!isToday?' active':''}">${lbl}</div>
      </div>`;
    }).join('');

    pane.innerHTML = `
      <div class="stats-row" style="margin-bottom:16px">
        <div class="stat-box"><span class="stat-num green">${wDone}</span><span class="stat-lbl">Done this week</span></div>
        <div class="stat-box"><span class="stat-num">${wTotal}</span><span class="stat-lbl">Scheduled</span></div>
        <div class="stat-box"><span class="stat-num accent">${streak}</span><span class="stat-lbl">Day streak</span></div>
        <div class="stat-box"><span class="stat-num">${wTotal?Math.round((wDone/wTotal)*100):0}%</span><span class="stat-lbl">Week rate</span></div>
      </div>
      <div class="week-cols">${bars}</div>
      <div class="chart-legend">
        <span class="legend-dot" style="background:#6B9E6B"></span>Done
        <span class="legend-dot" style="background:#C8B898"></span>Pending
      </div>
    `;
  }

  // ── Analytics: Month ──────────────────────────────────────────────────────────
  function renderAnalyticsMonth() {
    const pane   = document.getElementById('pane-month');
    const todStr = todayStr();
    const todD   = parseLocal(todStr);
    const data   = state.heatmap;

    // Start from 4 weeks ago, aligned to Monday
    const dow = todD.getDay();
    const calStart = new Date(todD);
    calStart.setDate(todD.getDate() - ((dow+6)%7) - 21);

    let mTotal = 0, mDone = 0, activeDays = 0;
    const dayLetters = ['M','T','W','T','F','S','S'];
    const weekLabels = ['–4w','–3w','–2w','–1w'];

    let html = '<div class="month-cal"><div class="month-week-row"><div></div>' +
      dayLetters.map(l=>`<div class="month-day-head">${l}</div>`).join('') + '</div>';

    for (let w = 0; w < 4; w++) {
      html += `<div class="month-week-row"><div class="month-week-lbl">${weekLabels[w]}</div>`;
      for (let d = 0; d < 7; d++) {
        const day = new Date(calStart); day.setDate(calStart.getDate() + w*7 + d);
        const ds  = `${day.getFullYear()}-${pad(day.getMonth()+1)}-${pad(day.getDate())}`;
        const e   = data[ds] || { total:0, done:0 };
        const isFut = ds > todStr;
        mTotal += e.total; mDone += e.done;
        if (e.total > 0) activeDays++;
        let cls = 'c0';
        if (!isFut && e.total > 0) {
          const p = e.done / e.total;
          cls = p>=1?'c4' : p>=.7?'c3' : p>=.4?'c2' : 'c1';
        }
        html += `<div class="month-cell ${cls}${ds===todStr?' today':''}${ds===state.date&&ds!==todStr?' active':''}${!isFut&&e.total>0?' has':''}"
          title="${ds}${e.total?`: ${e.done}/${e.total}`:''}"
          ${!isFut&&e.total>0 ? `onclick="window._navDate('${ds}')"` : ''}>
          ${day.getDate()}</div>`;
      }
      html += '</div>';
    }
    html += '</div>';

    pane.innerHTML = `
      <div class="stats-row" style="margin-bottom:14px">
        <div class="stat-box"><span class="stat-num green">${mDone}</span><span class="stat-lbl">Done (28d)</span></div>
        <div class="stat-box"><span class="stat-num">${mTotal}</span><span class="stat-lbl">Scheduled</span></div>
        <div class="stat-box"><span class="stat-num accent">${mTotal?Math.round((mDone/mTotal)*100):0}%</span><span class="stat-lbl">Avg rate</span></div>
        <div class="stat-box"><span class="stat-num">${activeDays}</span><span class="stat-lbl">Active days</span></div>
      </div>
      ${html}
      <div class="heatmap-legend">
        Less
        <span class="sq" style="background:var(--rule-2)"></span>
        <span class="sq" style="background:#D4E8D4"></span>
        <span class="sq" style="background:#AECFAE"></span>
        <span class="sq" style="background:#82B882"></span>
        <span class="sq" style="background:#5A8A5A"></span>
        More — click a day to navigate
      </div>
    `;
  }

  window._navDate = function(ds) { loadDay(ds); };

  // ── Analytics tabs ─────────────────────────────────────────────────────────────
  document.querySelectorAll('.atab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.atab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.apane').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('pane-' + tab.dataset.tab)?.classList.add('active');
    });
  });

  // ── Nav ───────────────────────────────────────────────────────────────────────
  document.getElementById('prevDay').addEventListener('click', () => loadDay(offset(state.date,-1)));
  document.getElementById('nextDay').addEventListener('click', () => loadDay(offset(state.date, 1)));
  document.getElementById('jumpDate').addEventListener('change', e => {
    if (e.target.value) loadDay(e.target.value);
  });

  // ── Init ──────────────────────────────────────────────────────────────────────
  window.onAuthReady = function(user) {
    if (user) {
      currentUid = user.uid;
      document.getElementById('reflectionSection').style.display = '';
      document.getElementById('analyticsSection').style.display  = '';
      loadCustomCats(user.uid);
      renderFilterBar();
      loadDay(todayStr());
      loadHeatmap();
    } else {
      location.replace('index.html');
    }
  };

})();
</script>

<script src="firebase-auth.js"></script>
</body>
</html>
